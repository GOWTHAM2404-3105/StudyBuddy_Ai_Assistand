{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block auth_content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="brand-icon d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-3">
                <i class="bi bi-mortarboard-fill fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1">Join Study<span class="text-primary">Buddy</span></h3>
            <p class="text-muted small">Create your student account to access AI study tools</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="full_name" class="form-label small fw-semibold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-card-heading"></i></span>
                    <input type="text" class="form-control border-start-0" id="full_name" name="full_name" 
                           value="{{ full_name or '' }}" placeholder="e.g. Alex Johnson" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" 
                           value="{{ username or '' }}" placeholder="alex24" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" name="email" 
                           value="{{ email or '' }}" placeholder="alex@college.edu" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Password (min 6 characters)</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" 
                           placeholder="Create a strong password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-person-check-fill me-1"></i> Create Account
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">Already have an account? 
                <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
