{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="brand-icon d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-3">
                <i class="bi bi-mortarboard-fill fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1">Study<span class="text-primary">Buddy</span></h3>
            <p class="text-muted small">Sign in to your intelligent academic study companion</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="identifier" class="form-label small fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0" id="identifier" name="identifier" 
                           value="{{ identifier or '' }}" placeholder="student or student@college.edu" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" 
                           placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">Don't have an account yet? 
                <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
